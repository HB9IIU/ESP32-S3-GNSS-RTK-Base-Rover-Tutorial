; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; platformio_local.ini (gitignored, created once, never touched again) holds
; the real --auth values for the *-ota environments below and overrides their
; placeholder upload_flags automatically -- no more exporting an env var by
; hand before every OTA upload. See platformio_local.ini.example.
[platformio]
extra_configs = platformio_local*.ini

[env]
platform = espressif32@6.11.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs

; -----------------------------------------------------------------------------
; Base station – ESP32-S3-WROOM-1-N16R8 devkit + ZED-F9P + 3DR radio
;   GPS:  ZED-F9P TX1→GPIO4  RX1←GPIO5
;   Tele: 3DR TX→GPIO17  RX←GPIO18
;   Survey-In → RTCM3 byte stream sent via the 3DR radio on UART2
; -----------------------------------------------------------------------------
[env:base]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<baseStationTele.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    ; This board's programming connector uses a WCH UART bridge. Keep Serial on
    ; UART0 so application logs appear on the same port as the ROM boot log.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48

; Base station OTA — flash wirelessly once the device is deployed
[env:base-ota]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<baseStationTele.cpp>
upload_protocol = espota
upload_port = rtk-base-tele.local
; Real value lives in platformio_local.ini (gitignored), which overrides this.
upload_flags = --auth=NOT-SET-see-platformio_local.ini
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48

; -----------------------------------------------------------------------------
; Rover station – ESP32-S3-WROOM-1-N16R8 devkit  +  ZED-F9P  +  3DR radio
;   GPS:  ZED-F9P TX1→GPIO4  RX1←GPIO5
;   Tele: 3DR TX→GPIO17  RX←GPIO18
;   Btn:  GPIO21 → GND
; -----------------------------------------------------------------------------
[env:rover]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<roverStationTele.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48
    -DBLIP_LED_PIN=47

; Rover OTA — flash wirelessly once the device is deployed
[env:rover-ota]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<roverStationTele.cpp>
upload_protocol = espota
upload_port = rtk-rover-tele.local
; Real value lives in platformio_local.ini (gitignored), which overrides this.
upload_flags = --auth=NOT-SET-see-platformio_local.ini
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48
    -DBLIP_LED_PIN=47

; -----------------------------------------------------------------------------
; LC29H(EA) rover — generic ESP32 DevKit (no PSRAM) + Quectel LC29H(EA)
;   GPS:  LC29H TX → GPIO16 (GPS_RX_PIN)   LC29H RX ← GPIO17 (GPS_TX_PIN)
;   Corrections arrive over ESP-NOW (broadcast) from the base station instead
;   of a 3DR radio — no TELE UART needed on this board.
;
;   This board has no PSRAM and only 4MB flash, so it doesn't set
;   board_build.arduino.memory_type at all (that key selects a prebuilt SDK
;   variant folder that only exists for PSRAM-capable chips like the S3;
;   setting it here — even blank — breaks the sdkconfig.h include path).
; -----------------------------------------------------------------------------
[env:lc29h-rover]
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = +<lc29hRoverTele.cpp>
build_flags =
    -DGPS_RX_PIN=16
    -DGPS_TX_PIN=17

; LC29H rover OTA — flash wirelessly once the device is deployed
[env:lc29h-rover-ota]
board = esp32dev
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = +<lc29hRoverTele.cpp>
upload_protocol = espota
upload_port = rtk-lc29h-rover.local
; Real value lives in platformio_local.ini (gitignored), which overrides this.
upload_flags = --auth=NOT-SET-see-platformio_local.ini
build_flags =
    -DGPS_RX_PIN=16
    -DGPS_TX_PIN=17
