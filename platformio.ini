; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; -----------------------------------------------------------------------------
; Base station – ESP32-S3-WROOM-1-N16R8 devkit + ZED-F9P + 3DR radio
;   GPS:  ZED-F9P TX1→GPIO4  RX1←GPIO5
;   Tele: 3DR TX→GPIO17  RX←GPIO18
;   Survey-In → RTCM3 byte stream sent via the 3DR radio on UART2
; -----------------------------------------------------------------------------
[env:base]
build_src_filter = +<baseStationTele.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    ; This board's programming connector uses a WCH UART bridge. Keep Serial on
    ; UART0 so application logs appear on the same port as the ROM boot log.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48

; Base station OTA — flash wirelessly once the device is deployed
[env:base-ota]
build_src_filter = +<baseStationTele.cpp>
upload_protocol = espota
upload_port = rtk-base-tele.local
; Export BASE_OTA_PASSWORD in your shell before uploading, matching the
; BASE_OTA_PASSWORD value in src/myconfig.h.
upload_flags = --auth=${sysenv.BASE_OTA_PASSWORD}
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48

; -----------------------------------------------------------------------------
; Rover station – ESP32-S3-WROOM-1-N16R8 devkit  +  ZED-F9P  +  3DR radio
;   GPS:  ZED-F9P TX1→GPIO4  RX1←GPIO5
;   Tele: 3DR TX→GPIO17  RX←GPIO18
;   Btn:  GPIO21 → GND
; -----------------------------------------------------------------------------
[env:rover]
build_src_filter = +<roverStationTele.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48
    -DBLIP_LED_PIN=47

; Rover OTA — flash wirelessly once the device is deployed
[env:rover-ota]
build_src_filter = +<roverStationTele.cpp>
upload_protocol = espota
upload_port = rtk-rover-tele.local
; Export ROVER_OTA_PASSWORD in your shell before uploading, matching the
; ROVER_OTA_PASSWORD value in src/myconfig.h.
upload_flags = --auth=${sysenv.ROVER_OTA_PASSWORD}
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTELE_RX_PIN=17
    -DTELE_TX_PIN=18
    -DRGB_LED_PIN=48
    -DBLIP_LED_PIN=47
